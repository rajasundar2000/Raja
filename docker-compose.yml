version: '3.8'
services:
  backend:
    build: ./backend
    container_name: leavepayroll-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    environment:
      - DATABASE_URL=sqlite:///./data/leave_payroll.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: leavepayroll-frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  data:
